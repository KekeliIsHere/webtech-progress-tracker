<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Progress Tracker</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="dashboard-page">

  <!-- Navbar -->
  <header class="navbar">
    <div class="nav-brand">
      <span class="logo-mark">&lt;/&gt;</span>
      <span class="brand-title">Course Tracker</span>
    </div>
    <div class="nav-user">
      <div class="user-meta">
        <span id="userName" class="user-name">Loading...</span>
        <span id="userId" class="user-id">ID: --------</span>
      </div>
      <button id="logoutBtn" class="btn btn-secondary">Sign Out</button>
    </div>
  </header>

  <main class="dashboard-container">
    
    <!-- Metrics Deck -->
    <section class="analytics-deck">
      <div class="stat-card">
        <span class="stat-label">Completed Lessons</span>
        <div class="stat-value-group">
          <span id="completedCount" class="stat-number">0</span>
          <span class="stat-total">/ 30</span>
        </div>
      </div>

      <div class="stat-card">
        <span class="stat-label">Overall Completion</span>
        <div class="stat-value-group">
          <span id="completionPercentage" class="stat-number">0%</span>
        </div>
        <div class="progress-track">
          <div id="progressBar" class="progress-fill" style="width: 0%;"></div>
        </div>
      </div>

      <div class="stat-card">
        <span class="stat-label">Eligible for Quiz</span>
        <div class="stat-value-group">
          <span id="eligibleCount" class="stat-number">0</span>
          <span class="stat-total">/ 30</span>
        </div>
      </div>
    </section>

    <!-- Toolbar Filters & Search -->
    <section class="controls-bar">
      <div class="filter-buttons">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="eligible">Eligible</button>
        <button class="filter-btn" data-filter="completed">Completed</button>
        <button class="filter-btn" data-filter="incomplete">Incomplete</button>
      </div>

      <div class="search-box">
        <input type="text" id="searchInput" placeholder="Search lesson (e.g. 05)...">
      </div>
    </section>

    <!-- The 7-Column Table Matrix -->
    <section class="table-card">
      <div class="table-wrapper">
        <table class="tracker-table">
          <thead>
            <tr>
              <th class="col-lesson">Lesson</th>
              <th class="col-task">Reading Quiz</th>
              <th class="col-task">Lab</th>
              <th class="col-task">Discussion</th>
              <th class="col-status">Quiz Eligibility</th>
              <th class="col-task">Terminal Quiz</th>
              <th class="col-status">Lesson Status</th>
            </tr>
          </thead>
          <tbody id="trackerTableBody">
            <!-- Rendered dynamically by tracker.js -->
          </tbody>
        </table>
      </div>
    </section>

  </main>

  <script src="js/tracker.js"></script>
</body>
</html>
